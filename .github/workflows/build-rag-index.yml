name: Build and publish RAG index
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "knowledge/**"
      - "backend/rag/build_vector_db.py"
      - "backend/rag/document_store.py"
      - "backend/rag/chunker.py"
      - "backend/rag/graph_index.py"
      - ".github/workflows/build-rag-index.yml"
permissions:
  contents: write
concurrency:
  group: rag-index-build
  cancel-in-progress: false
jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install indexing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Build SQLite FTS5 index and evidence graph
        run: python -m backend.rag.build_vector_db
      - name: Verify generated index
        run: |
          test -s backend/indexes/tcs_knowledge.sqlite3
          test -s backend/indexes/tcs_knowledge_graph.json
          python - <<'PY'
          import sqlite3
          from backend.rag.document_store import get_index
          from backend.rag.graph_index import load_graph
          index = get_index()
          count = index.count()
          assert count > 0, "Empty FTS index"
          assert index.search("TCS revenue FY2026", 5), "FTS smoke query returned no results"
          graph = load_graph()
          assert graph.number_of_nodes() > 0, "Empty knowledge graph"
          print(f"Verified {count} SQLite FTS5 chunks; graph={graph.number_of_nodes()} nodes/{graph.number_of_edges()} edges")
          PY
      - name: Package index
        run: zip -qr backend/rag-index.zip backend/indexes/tcs_knowledge.sqlite3 backend/indexes/tcs_knowledge_graph.json
      - name: Publish versioned GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rag-index-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" backend/rag-index.zip#rag-index.zip --repo "$GITHUB_REPOSITORY" --title "RAG index ${GITHUB_RUN_NUMBER}" --notes "SQLite FTS5 lexical index and NetworkX evidence graph from commit ${GITHUB_SHA}. Groq is used only for answer generation."

name: TCS retrieval benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "evaluation/tcs_benchmark.json"
      - "evaluation/run_tcs_benchmark.py"
      - "evaluation/benchmark.py"
      - ".github/workflows/tcs-retrieval-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: tcs-retrieval-benchmark
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "sentence-transformers>=3.0,<6.0"

      - name: Download latest published RAG index
        run: python -m backend.rag.download_index

      - name: Run retrieval comparison and answer audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: python -m evaluation.run_tcs_benchmark

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: tcs-retrieval-benchmark
          path: evaluation/results/
          if-no-files-found: error
          retention-days: 90
